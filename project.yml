name: Agnoria
options:
  bundleIdPrefix: com.himatsubu
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: U9296HT99T
targets:
  Agnoria:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Agnoria
    entitlements:
      path: Agnoria/Agnoria.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Agnoria/Info.plist
      properties:
        CFBundleDisplayName: Agnoria
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: ""
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.himatsubu.Agnoria
        PRODUCT_NAME: Agnoria
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  AgnoriaTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AgnoriaTests
    dependencies:
      - target: Agnoria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.himatsubu.AgnoriaTests
        GENERATE_INFOPLIST_FILE: YES
        # macOS の実行ファイルは .app/Contents/MacOS/ 配下
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Agnoria.app/Contents/MacOS/Agnoria"
schemes:
  Agnoria:
    build:
      targets:
        Agnoria: all
        AgnoriaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgnoriaTests
